name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run release:check
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")"
          NAME="$(node -p "require('./package.json').name")"
          ACCESS=""
          case "$NAME" in
            @*) ACCESS="--access public" ;;
          esac
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "tag/version mismatch: ${GITHUB_REF_NAME} vs $VERSION"
            exit 1
          fi
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already published: $NAME@$VERSION; skipping npm publish"
            exit 0
          fi
          npm publish --provenance --tag "$TAG" $ACCESS

      - name: Pack release artifact
        run: npm pack

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            PRE="--prerelease"
          else
            PRE=""
          fi
          gh release create "$GITHUB_REF_NAME" ./*.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRE || \
          gh release upload "$GITHUB_REF_NAME" ./*.tgz --clobber
